<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Gier</title>
    <link rel="stylesheet" href="styl_listy.css">
</head>
<body>
    <h2>Gówno Horrorki</h2>
    
    <input type="text" id="gameInput" placeholder="Szukaj gry...">
    <p id="status" style="color: gray;">Ładowanie listy...</p>
    
    <ul id="gameList"></ul>

    <script>
        // Twój link do Google Apps Script
        const API_URL = 'https://script.google.com/macros/s/AKfycbz4ovKApyPM-TNMOP8LQU9QKpfuw-hqK3UbUChVw84xVvKEIG3GBIjNtRNkkAgdy8Xl/exec';

        // Tablica przechowująca wszystkie pobrane gry do lokalnego filtrowania
        let allGames = [];

        // Funkcja pobierająca gry z serwera
        function loadGames() {
            fetch(API_URL)
                .then(response => response.json())
                .then(games => {
                    document.getElementById('status').innerText = '';
                    allGames = games; // Zapisz pobrane gry do zmiennej globalnej
                    searchGames(); // Zaktualizuj listę (z uwzględnieniem obecnego filtra)
                })
                .catch(error => {
                    console.error('Błąd odświeżania listy w tle:', error);
                });
        }

        // Funkcja filtrująca i renderująca gry na stronie
        function searchGames() {
            const searchPhrase = document.getElementById('gameInput').value.toLowerCase().trim();
            const list = document.getElementById('gameList');
            
            // Filtrujemy zapisane gry na podstawie wpisanej frazy
            const filteredGames = allGames.filter(game => 
                game.toLowerCase().includes(searchPhrase)
            );
            
            let newHTML = ''; 
            filteredGames.forEach(game => {
                newHTML += `<li>${game}</li>`;
            });
            
            // Obsługa braku wyników
            if (filteredGames.length === 0 && searchPhrase !== '') {
                newHTML = '<li style="color: gray;">Brak gier pasujących do wyszukiwania...</li>';
            }
            
            // Aktualizuje widok tylko jeśli HTML się zmienił
            if(list.innerHTML !== newHTML) {
                list.innerHTML = newHTML;
            }
        }

        // Konfiguracja uruchamiana zaraz po załadowaniu strony
        document.addEventListener('DOMContentLoaded', () => {
            loadGames(); // Ładuje gry na start
            
            const inputField = document.getElementById('gameInput');
            
            // Wyszukiwanie "na żywo" w trakcie wpisywania tekstu
            inputField.addEventListener('input', searchGames);
            
            // Obsługa klawisza Enter
            inputField.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Zapobiega dziwnym odświeżeniom strony
                    searchGames(); 
                }
            });

            // Automatyczne odświeżanie bazy co 10 sekund
            setInterval(loadGames, 10000); 
        });
    </script>
</body>
</html>
