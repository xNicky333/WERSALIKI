<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Gier</title>
    <link rel="stylesheet" href="styl_listy.css">
</head>
<body>
    <h2>W co grają Wersaliki?</h2>
    
    <input type="text" id="gameInput" placeholder="Np. Minecraft...">
    <button onclick="addGame()" id="addBtn">Dodaj grę</button>
    <p id="status" style="color: gray;">Ładowanie listy...</p>
    
    <ul id="gameList"></ul>

    <script>
        // Twój link do Google Apps Script
        const API_URL = 'https://script.google.com/macros/s/AKfycbz4ovKApyPM-TNMOP8LQU9QKpfuw-hqK3UbUChVw84xVvKEIG3GBIjNtRNkkAgdy8Xl/exec';

        // Funkcja pobierająca gry po wejściu na stronę
        function loadGames() {
            fetch(API_URL)
                .then(response => response.json())
                .then(games => {
                    document.getElementById('status').innerText = '';
                    const list = document.getElementById('gameList');
                    
                    // Zapisujemy w pamięci, żeby lista nie mrugała przy odświeżaniu
                    let newHTML = ''; 
                    games.forEach(game => {
                        newHTML += `<li>${game}</li>`;
                    });
                    
                    // Aktualizuje widok tylko jeśli coś się zmieniło lub ładujemy pierwszy raz
                    if(list.innerHTML !== newHTML) {
                        list.innerHTML = newHTML;
                    }
                })
                .catch(error => {
                    // Żeby nie denerwować użytkowników błędem przy chwilowym braku internetu,
                    // błąd wyświetli się tylko w konsoli, bez psucia wyglądu strony
                    console.error('Błąd odświeżania listy w tle:', error);
                });
        }

        // Funkcja wysyłająca nową grę do Arkusza
        function addGame() {
            const input = document.getElementById('gameInput');
            const btn = document.getElementById('addBtn');
            const gameName = input.value.trim();

            if (gameName) {
                btn.disabled = true;
                btn.innerText = 'Zapisywanie...';

                // Wysyłamy żądanie z nazwą gry
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'game=' + encodeURIComponent(gameName)
                })
                .then(response => response.text())
                .then(() => {
                    input.value = ''; // Czyszczenie pola po dodaniu
                    btn.disabled = false;
                    btn.innerText = 'Dodaj grę';
                    loadGames(); // Pobranie odświeżonej listy natychmiast po dodaniu
                })
                .catch(error => {
                    alert('Nie udało się zapisać gry.');
                    btn.disabled = false;
                    btn.innerText = 'Dodaj grę';
                });
            }
        }

        // Konfiguracja uruchamiana zaraz po załadowaniu strony
        document.addEventListener('DOMContentLoaded', () => {
            loadGames(); // Ładuje gry na start
            
            // Obsługa klawisza Enter
            const inputField = document.getElementById('gameInput');
            inputField.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Zapobiega dziwnym odświeżeniom strony
                    addGame(); // Odpala tę samą funkcję co przycisk
                }
            });

            // DODANE: Automatyczne odświeżanie w tle
            // 10000 oznacza 10 000 milisekund (czyli 10 sekund)
            setInterval(loadGames, 10000); 
        });
    </script>
</body>
</html>
