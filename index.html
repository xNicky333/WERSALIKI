<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WERSALIKI</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="icon" type="image/png" href="wersa_logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>

    <!-- PRZYCISK LOGOWANIA -->
    <button id="loginBtn" class="login-btn">
        <i class="fas fa-user"></i> <span id="loginText">Zaloguj</span>
    </button>

    <div id="wersaliki" class="mid">
        <img src="wersal_baner_biały.png" alt="WERSALIKI" srcset="" id="foto">
    </div>
    
    <div id="info" class="mid">
        <h1>Znajdziesz nas na:</h1>

        <div id="linki">
            <div class="link-item">
                <a target="_blank" href="https://www.youtube.com/@Wersaliki_OG">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
            </div>

            <div class="link-item">
                <a target="_blank" href="https://www.tiktok.com/@wersaliki_og">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
            </div>

            <div class="link-item">
                <a target="_blank" href="https://www.twitch.tv/zreku">
                    <i class="fab fa-twitch"></i> Twitch
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="link_yt">
            <iframe class="iframe" width="300" height="200" src="https://www.youtube-nocookie.com/embed/CR5h32sLlVQ?si=xUQR_AVwJlexsqCQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>        
        </div>
        <div class="link_yt">
            <iframe class="iframe" width="300" height="200" src="https://www.youtube-nocookie.com/embed/0lGJhLyszLM?si=Zut8m3kWqVgWy3tR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>
    
    <div class="kawa">
        <a href="https://buycoffee.to/wersaliki" target="_blank"><img src="https://buycoffee.to/static/img/share/share-button-dark.png" style="width: 293px; height: 76px" alt="Postaw nam kawę na buycoffee.to"></a>
    </div>

    <!-- MODAL LOGOWANIA -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2>Logowanie</h2>
            <input type="password" id="loginUser" placeholder="Login" autocomplete="username">
            <input type="password" id="loginPass" placeholder="Hasło" autocomplete="current-password">
            <button id="submitLogin">Zaloguj się</button>
            <p id="loginStatus"></p>
        </div>
    </div>

    <!-- UKRYTE MENU (widoczne dopiero po zalogowaniu) -->
    <div id="hiddenMenu" class="hidden-menu">
        <h2>Menu ekipy</h2>
        <ul>
            <li><a href="https://wersaliki.pl/lista">Górwno Horrorki</a></li>
            <li><a href="#">Przykładowy link 2</a></li>
            <li><a href="#">Przykładowy link 3</a></li>
        </ul>
        <button id="logoutBtn">Wyloguj</button>
    </div>

    <script src="skrypt.js"></script>
</body>
</html>
